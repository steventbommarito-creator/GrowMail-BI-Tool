name: Industry Tags Drain

# Adds "<Industry> - 30 Day Untouched" tags to FW contacts staged by
# `node crm-import/industry-tags.js build` (Dental, Church or Ministry), paced
# under the 2000/hr cap. Resumable: each run drains ~50 min then exits; the next
# hourly run continues. Exits immediately once everything is tagged — remove the
# schedule after that. Freshsales writes are enabled for this job ONLY (tags).

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

concurrency:
  group: industry-tags
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node crm-import/industry-tags.js tag
        env:
          CI: 'true'
          MAX_RUNTIME_MS: '3000000'
          FRESHSALES_WRITES_ENABLED: 'true'
          FRESHSALES_DOMAIN: ${{ secrets.FRESHSALES_DOMAIN }}
          FRESHSALES_API_KEY: ${{ secrets.FRESHSALES_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
