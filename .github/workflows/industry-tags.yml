name: Industry Tags Drain

# Adds "<Industry> - 30 Day Untouched" tags to FW contacts staged by
# `node crm-import/industry-tags.js build` (Dental, Church or Ministry), paced
# well under the FW cap (27,000/hr + 1,350/min as of 2026-11-05). Resumable: each run drains ~50 min then exits; the next
# run continues. GitHub drops many hourly cron slots, so a run that ends with
# rows left re-dispatches itself; the cron is only a backstop. Exits immediately
# once everything is tagged — remove the schedule after that. Freshsales writes are enabled for this job ONLY (tags).

on:
  # Finished 2026-11-05 (12,429 tagged) — schedule removed; dispatch for a new staged batch.
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: industry-tags
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - id: drain
        shell: bash   # explicit bash = pipefail, so a crash under tee still fails the step
        run: node crm-import/industry-tags.js tag | tee drain.log
        env:
          CI: 'true'
          MAX_RUNTIME_MS: '3000000'
          FRESHSALES_RATE: '20000'
          TAG_WORKERS: '5'
          FRESHSALES_WRITES_ENABLED: 'true'
          FRESHSALES_DOMAIN: ${{ secrets.FRESHSALES_DOMAIN }}
          FRESHSALES_API_KEY: ${{ secrets.FRESHSALES_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Chain the next run if rows remain
        if: success()
        run: grep -q 'Runtime budget reached' drain.log && gh workflow run industry-tags.yml --ref main || echo 'No rows left — not chaining.'
        env:
          GH_TOKEN: ${{ github.token }}
