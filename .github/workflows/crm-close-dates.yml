name: CRM Deal Close-Date Fix

# Rewrites closed_date (+expected_close) on the ~28k imported deals to the true
# SFDC Close Date — FW auto-stamped them all with the July 2026 import date.
# Resumable hourly; ~15h total. Delete once complete.

on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

concurrency:
  group: crm-close-dates
  cancel-in-progress: false

env:
  CI: 'true'
  MAX_RUNTIME_MS: '3000000'
  FRESHSALES_RATE: '20000'   # plan upgraded to 25k/hr; client 429-backoff covers propagation lag
  FRESHSALES_DOMAIN: ${{ secrets.FRESHSALES_DOMAIN }}
  FRESHSALES_API_KEY: ${{ secrets.FRESHSALES_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node crm-import/deal-close-dates.js drain
