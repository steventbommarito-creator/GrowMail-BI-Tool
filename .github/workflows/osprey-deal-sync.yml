name: Osprey Live Sync (3-min loop)

# Near-real-time Osprey → Freshworks: one runner per hour that LOOPS for ~54
# minutes — scrape finance report + deal-sync every ~3 minutes, lead-sync every
# ~3rd iteration (~10 min). GitHub cron can't go below 5 min and pays 2-3 min
# setup per run, so a continuous in-run loop is the only way to a true 3-minute
# cadence. Hourly triggers chain the loops back-to-back during business hours
# (7a–6p EST; +9p/11p EST catch-ups). Concurrency group prevents overlap.

on:
  schedule:
    - cron: '0 2,4,12-23 * * *'
  workflow_dispatch:

concurrency:
  group: osprey-deal-sync
  cancel-in-progress: false

env:
  CI: 'true'
  OSPREY_URL: ${{ secrets.OSPREY_URL }}
  OSPREY_USER: ${{ secrets.OSPREY_USER }}
  OSPREY_PASS: ${{ secrets.OSPREY_PASS }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  FRESHSALES_DOMAIN: ${{ secrets.FRESHSALES_DOMAIN }}
  FRESHSALES_API_KEY: ${{ secrets.FRESHSALES_API_KEY }}
  TRIGGERED_BY: osprey-live-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install chromium --with-deps
        timeout-minutes: 10
      - name: Loop scrape + sync every ~3 minutes
        env:
          SCRAPE_SOURCE: osprey
          MAX_RUNTIME_MS: '240000'   # per lead-sync pass; deal-sync is diff-cheap
        run: |
          end=$((SECONDS+3240))   # ~54 min of looping
          i=0
          while [ $SECONDS -lt $end ]; do
            t0=$SECONDS
            node run.js || echo "scrape failed (iteration $i) — continuing"
            node crm-import/osprey-deal-sync.js || echo "deal-sync failed (iteration $i) — continuing"
            if [ $((i % 3)) -eq 0 ]; then
              node crm-import/osprey-lead-sync.js || echo "lead-sync failed (iteration $i) — continuing"
            fi
            i=$((i+1))
            el=$((SECONDS-t0))
            if [ $el -lt 180 ]; then sleep $((180-el)); fi
          done
          echo "loop done: $i iterations"
