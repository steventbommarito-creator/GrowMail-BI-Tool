name: CRM Owner Fix — Nick Krutko

# One-shot backfill: reassign the ~3,600 SFDC-import deals stuck on Customer
# Service (Opportunity Owner was "NickK@growmail.com") to Nicholas Krutko.
# Idempotent + resumable; only flips deals currently owned by CS. Delete this
# file once complete.

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

concurrency:
  group: crm-owner-fix-nick
  cancel-in-progress: false

env:
  CI: 'true'
  MAX_RUNTIME_MS: '3000000'
  FRESHSALES_DOMAIN: ${{ secrets.FRESHSALES_DOMAIN }}
  FRESHSALES_API_KEY: ${{ secrets.FRESHSALES_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node crm-import/owner-fix-nick.js drain
