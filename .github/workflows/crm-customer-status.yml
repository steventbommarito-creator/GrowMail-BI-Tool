name: CRM Customer Status (Batch 2)

# Batch 2: promote Won-deal contacts to lifecycle "Customer" (never downgrade).
# Targets pre-staged in Supabase (~5,623: SFDC Won contact emails + Osprey Won
# accounts). Resumable; ~5-6h. Scheduled to START at 6pm ET and drain hourly
# overnight. Recurs daily but no-ops once complete — delete this file then.
#
# Cron is UTC. 6pm EDT = 22:00 UTC (summer). Hourly 22:00 UTC → 13:00 UTC covers
# 6pm ET through the next morning.

on:
  schedule:
    - cron: '0 22,23 * * *'
    - cron: '0 0-13 * * *'
  workflow_dispatch:

concurrency:
  group: crm-customer-status
  cancel-in-progress: false

env:
  CI: 'true'
  MAX_RUNTIME_MS: '3000000'
  FRESHSALES_DOMAIN: ${{ secrets.FRESHSALES_DOMAIN }}
  FRESHSALES_API_KEY: ${{ secrets.FRESHSALES_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node crm-import/customer-status-backfill.js load   # idempotent (no-op if already staged)
      - run: node crm-import/customer-status-backfill.js drain
