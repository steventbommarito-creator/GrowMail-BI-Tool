name: CRM Lead Enrichment (priority 4)

# Enrich ~292k lead-contacts from the SFDC Lead table: cf_company + address +
# phones + title, fill-empty-only. load stages with page checkpoints (~3h scan,
# resumes if killed; no-op once staging_done); drains resume until complete
# (~15-16h at 20k/hr). Long runs (350min) — the hourly cron just queues the
# next run behind the live one (concurrency group holds one in the wings).
# Delete this workflow once the job reports COMPLETE.

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

concurrency:
  group: crm-lead-enrich
  cancel-in-progress: false

env:
  CI: 'true'
  FRESHSALES_RATE: '20000'
  FRESHSALES_DOMAIN: ${{ secrets.FRESHSALES_DOMAIN }}
  FRESHSALES_API_KEY: ${{ secrets.FRESHSALES_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  SFDC_INSTANCE_URL: ${{ secrets.SFDC_INSTANCE_URL }}
  SFDC_CLIENT_ID: ${{ secrets.SFDC_CLIENT_ID }}
  SFDC_CLIENT_SECRET: ${{ secrets.SFDC_CLIENT_SECRET }}

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node crm-import/lead-enrich.js load
      - run: node crm-import/lead-enrich.js drain
        env:
          MAX_RUNTIME_MS: '18000000'
